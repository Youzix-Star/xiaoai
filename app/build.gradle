plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hook.xiaomi_ai_devopt'
    compileSdk 34

    defaultConfig {
        applicationId "com.hook.xiaomi_ai_devopt"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.6"
    }

    // 显式指定 debug 签名用的 keystore。
    // 不指定的话 AGP 会在自己的位置找/生成 debug.keystore —— CI 上那个位置每次都是新的，
    // 于是每次产物签名都不同，装新版必须先卸载旧的。
    signingConfigs {
        debug {
            storeFile file(System.getenv("XIAOAI_DEBUG_KEYSTORE")
                    ?: "${System.getProperty("user.home")}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Xposed API - provided by LSPosed at runtime, not packaged into APK
    compileOnly 'de.robv.android.xposed:api:82'
}
